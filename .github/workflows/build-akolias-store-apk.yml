name: Build Akolias Store APK
on:
  push:
    paths:
      - 'store-android/**'
      - '.github/workflows/build-akolias-store-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: store-android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Akolias-Store-APK
          path: store-android/app/build/outputs/apk/debug/app-debug.apk
