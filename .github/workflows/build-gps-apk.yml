name: Build ZEWAY IoT Tracking APK

on:
  push:
    branches:
      - zeway-gps-tracking-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZEWAY-IoT-Tracking-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEWAY-IoT-Tracking-v2-APK
          path: ZEWAY-IoT-Tracking-v2.0.apk
          retention-days: 30
