<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akolias Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#111827}button,input,textarea{font:inherit}
header{position:sticky;top:0;z-index:9;background:#fff;padding:14px 16px 12px;box-shadow:0 2px 10px #00000012}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:23px;font-weight:800}.brand b{color:#6d28d9}.cartBtn{border:0;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}
.search{margin-top:12px;width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:13px;background:#f9fafb}
.hero{margin:14px 14px 8px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#5b21b6,#ec4899);color:#fff}.hero h2{margin:0 0 5px;font-size:23px}.hero p{margin:0;opacity:.9}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 14px 2px}.chip{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:20px}.chip.active{background:#111827;color:#fff;border-color:#111827}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 14px 90px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #0000000d}.pic{height:145px;background:#eee center/cover}.info{padding:10px}.title{font-size:14px;font-weight:700;min-height:34px}.price{font-size:18px;font-weight:800;margin-top:6px}.mrp{font-size:12px;color:#6b7280;text-decoration:line-through;margin-left:5px}.rating{font-size:12px;color:#047857;margin:6px 0}.add{width:100%;border:0;background:#6d28d9;color:#fff;border-radius:10px;padding:10px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #eee;z-index:10}.navb{border:0;background:#fff;padding:12px 4px 13px;font-size:13px}.navb strong{display:block;font-size:20px}
.sheet{position:fixed;inset:0;background:#0008;z-index:30;display:none}.panel{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding:18px}.panel h3{margin:0 0 12px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.thumb{width:58px;height:58px;border-radius:10px;background:#eee center/cover}.grow{flex:1}.qty button{border:1px solid #ddd;background:#fff;width:28px;height:28px;border-radius:8px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:16px 0}.checkout{width:100%;border:0;background:#111827;color:#fff;padding:14px;border-radius:12px;font-weight:800}
.form input,.form textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}.pay{display:flex;gap:8px;margin:9px 0}.pay label{flex:1;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:13px}
.empty{text-align:center;color:#6b7280;padding:35px 10px}.order{background:#fff;border-radius:14px;padding:14px;margin:10px 0;border:1px solid #eee}.badge{display:inline-block;background:#dcfce7;color:#166534;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:50}
</style></head>
<body>
<header><div class="top"><div class="brand"><b>Akolias</b> Store</div><button class="cartBtn" onclick="openCart()">🛒 <span id="count">0</span></button></div><input class="search" id="q" placeholder="Search products..." oninput="render()"></header>
<div id="home">
<section class="hero"><h2>Big Savings, Easy Shopping</h2><p>Quality products • COD available • Easy ordering</p></section>
<div class="chips" id="chips"></div><main class="grid" id="grid"></main>
</div>
<div id="ordersPage" style="display:none;padding:14px 14px 90px"><h2>My Orders</h2><div id="orders"></div></div>
<div id="accountPage" style="display:none;padding:14px 14px 90px"><h2>My Account</h2><div class="order"><b>Akolias Store Customer</b><p style="color:#6b7280">Your saved orders and shopping cart stay on this device in this test APK.</p></div><button class="checkout" onclick="showToast('Support feature will be connected in live version')">Customer Support</button></div>
<nav><button class="navb" onclick="page('home')"><strong>🏠</strong>Home</button><button class="navb" onclick="page('orders')"><strong>📦</strong>Orders</button><button class="navb" onclick="page('account')"><strong>👤</strong>Account</button></nav>

<div class="sheet" id="cartSheet"><div class="panel"><button class="close" onclick="closeSheet('cartSheet')">×</button><h3>Your Cart</h3><div id="cartRows"></div><div class="total"><span>Total</span><span id="cartTotal">₹0</span></div><button class="checkout" onclick="startCheckout()">Proceed to Checkout</button></div></div>
<div class="sheet" id="checkoutSheet"><div class="panel"><button class="close" onclick="closeSheet('checkoutSheet')">×</button><h3>Delivery Details</h3><div class="form"><input id="name" placeholder="Full name"><input id="phone" inputmode="tel" placeholder="Mobile number"><textarea id="address" rows="3" placeholder="Full delivery address"></textarea><input id="pin" inputmode="numeric" placeholder="PIN code"><div class="pay"><label><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label><label><input type="radio" name="pay" value="UPI"> UPI</label></div><button class="checkout" onclick="placeOrder()">Place Order</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const products=[
{id:1,n:'Premium Cotton Bedsheet',p:499,m:899,c:'Home',r:'4.4 ★',img:'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=600'},
{id:2,n:'Women Stylish Handbag',p:599,m:1199,c:'Fashion',r:'4.3 ★',img:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600'},
{id:3,n:'Stainless Steel Bottle',p:299,m:599,c:'Kitchen',r:'4.5 ★',img:'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600'},
{id:4,n:'LED Night Lamp',p:349,m:699,c:'Electronics',r:'4.2 ★',img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600'},
{id:5,n:'Men Casual T-Shirt',p:399,m:799,c:'Fashion',r:'4.1 ★',img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600'},
{id:6,n:'Kitchen Storage Set',p:449,m:999,c:'Kitchen',r:'4.6 ★',img:'https://images.unsplash.com/photo-1584634731339-252c581abfc5?w=600'},
{id:7,n:'Mobile Charging Cable',p:199,m:399,c:'Electronics',r:'4.0 ★',img:'https://images.unsplash.com/photo-1556656793-08538906a9f8?w=600'},
{id:8,n:'Decorative Cushion Cover',p:249,m:499,c:'Home',r:'4.3 ★',img:'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600'}];
let category='All',cart=JSON.parse(localStorage.getItem('cart')||'{}');
function money(n){return '₹'+n.toLocaleString('en-IN')}
function chips(){const cs=['All',...new Set(products.map(x=>x.c))];document.getElementById('chips').innerHTML=cs.map(c=>'<button class="chip '+(c===category?'active':'')+'" onclick="category=\''+c+'\';chips();render()">'+c+'</button>').join('')}
function render(){let q=document.getElementById('q').value.toLowerCase();let list=products.filter(x=>(category==='All'||x.c===category)&&x.n.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(x=>'<div class="card"><div class="pic" style="background-image:url('+x.img+')"></div><div class="info"><div class="title">'+x.n+'</div><div class="price">'+money(x.p)+'<span class="mrp">'+money(x.m)+'</span></div><div class="rating">'+x.r+' • Free Delivery</div><button class="add" onclick="add('+x.id+')">Add to Cart</button></div></div>').join('')}
function save(){localStorage.setItem('cart',JSON.stringify(cart));document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function add(id){cart[id]=(cart[id]||0)+1;save();showToast('Added to cart')}
function openCart(){renderCart();document.getElementById('cartSheet').style.display='block'}
function closeSheet(id){document.getElementById(id).style.display='none'}
function renderCart(){let ids=Object.keys(cart).filter(id=>cart[id]>0);if(!ids.length){document.getElementById('cartRows').innerHTML='<div class="empty">Your cart is empty</div>';document.getElementById('cartTotal').textContent='₹0';return}let total=0;document.getElementById('cartRows').innerHTML=ids.map(id=>{let x=products.find(p=>p.id==id),q=cart[id];total+=x.p*q;return '<div class="row"><div class="thumb" style="background-image:url('+x.img+')"></div><div class="grow"><b>'+x.n+'</b><div>'+money(x.p*q)+'</div></div><div class="qty"><button onclick="chg('+id+',-1)">−</button> '+q+' <button onclick="chg('+id+',1)">+</button></div></div>'}).join('');document.getElementById('cartTotal').textContent=money(total)}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderCart()}
function startCheckout(){if(!Object.keys(cart).length)return showToast('Cart is empty');closeSheet('cartSheet');document.getElementById('checkoutSheet').style.display='block'}
function placeOrder(){let name=v('name'),phone=v('phone'),address=v('address'),pin=v('pin');if(!name||phone.length<10||!address||pin.length<6)return showToast('Please fill complete delivery details');let pay=document.querySelector('input[name=pay]:checked').value;let ids=Object.keys(cart);let total=ids.reduce((s,id)=>s+products.find(x=>x.id==id).p*cart[id],0);let order={id:'AK'+Date.now().toString().slice(-8),date:new Date().toLocaleString(),name,phone,address,pin,pay,total,status:'Confirmed',items:ids.map(id=>({name:products.find(x=>x.id==id).n,qty:cart[id]}))};let orders=JSON.parse(localStorage.getItem('orders')||'[]');orders.unshift(order);localStorage.setItem('orders',JSON.stringify(orders));cart={};save();closeSheet('checkoutSheet');showToast('Order placed: '+order.id);page('orders')}
function v(id){return document.getElementById(id).value.trim()}
function page(p){['home','ordersPage','accountPage'].forEach(id=>document.getElementById(id).style.display='none');if(p==='home')document.getElementById('home').style.display='block';if(p==='orders'){document.getElementById('ordersPage').style.display='block';renderOrders()}if(p==='account')document.getElementById('accountPage').style.display='block'}
function renderOrders(){let os=JSON.parse(localStorage.getItem('orders')||'[]');document.getElementById('orders').innerHTML=os.length?os.map(o=>'<div class="order"><div><b>Order #'+o.id+'</b> <span class="badge">'+o.status+'</span></div><small>'+o.date+'</small><p>'+o.items.map(i=>i.name+' × '+i.qty).join('<br>')+'</p><b>Total: '+money(o.total)+'</b><div style="color:#6b7280;margin-top:5px">Payment: '+o.pay+'</div></div>').join(''):'<div class="empty">No orders yet</div>'}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
chips();render();save();
</script></body></html>
